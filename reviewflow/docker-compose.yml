# Local development stack: MongoDB + Go API + Vite dev server.
#
#   cp .env.example .env        # optional: add GEMINI_API_KEY / GitHub keys
#   docker compose up --build
#   open http://localhost:5173  -> "Continue as guest"
#
# Edit server/ or web/ and the containers pick the change up (Go restarts on
# `docker compose restart server`; Vite hot-reloads on its own).

services:
  mongo:
    image: mongo:7
    restart: unless-stopped
    ports: ["27017:27017"]
    volumes: [mongo_data:/data/db]
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 15s

  server:
    image: golang:1.23-alpine
    working_dir: /app
    command: ["go", "run", "./cmd/server"]
    env_file:
      - path: .env
        required: false
    environment:
      GOFLAGS: -mod=mod
      MONGO_URI: mongodb://mongo:27017   # authoritative inside the compose network
    ports: ["8080:8080"]
    volumes:
      - ./server:/app
      - go_mod_cache:/go/pkg/mod
    depends_on:
      mongo: { condition: service_healthy }

  web:
    image: node:22-alpine
    working_dir: /app
    command: ["sh", "-c", "npm install && npm run dev -- --host 0.0.0.0"]
    environment:
      BACKEND_URL: http://server:8080   # Vite proxies /auth /graphql /ws /notifications here
    ports: ["5173:5173"]
    volumes:
      - ./web:/app
      - web_node_modules:/app/node_modules
    depends_on: [server]

volumes:
  mongo_data:
  go_mod_cache:
  web_node_modules:
