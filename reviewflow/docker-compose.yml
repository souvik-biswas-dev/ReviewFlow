# Local development stack for ReviewFlow.
#
# Quick start:
#   cp .env.example .env
#   docker compose up        # Ctrl+C to stop
#
# The app service runs the TypeScript sources directly under `node --watch`:
# edit any file under server/src and the server restarts automatically.

services:
  mongo:
    image: mongo:7
    container_name: reviewflow-mongo
    restart: unless-stopped
    ports:
      - "27017:27017"
    volumes:
      # Named volume so database contents survive container restarts/rebuilds.
      - mongo_data:/data/db
    healthcheck:
      # The app waits for this to pass (see depends_on) before connecting.
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s

  app:
    image: node:24-alpine
    container_name: reviewflow-app
    working_dir: /app
    # Resolve dependencies against the bind-mounted source on first boot, then
    # hand off to the watcher.
    command: ["sh", "-c", "npm install && npm run dev"]
    ports:
      - "8080:8080"
    volumes:
      - ./server:/app
      # Keep container-installed modules out of the host tree (and vice versa):
      # the two platforms don't necessarily share native builds.
      - node_modules:/app/node_modules
    env_file:
      - .env
    environment:
      # Authoritative inside the Compose network: reach Mongo by service name,
      # regardless of what MONGO_URI a developer's .env happens to contain.
      - MONGO_URI=mongodb://mongo:27017
    depends_on:
      mongo:
        condition: service_healthy

volumes:
  mongo_data:
  node_modules:
